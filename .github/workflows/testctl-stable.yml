name: Testctl stable regression

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.5'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install network isolation runner
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install locked test dependencies
        run: uv sync --locked --group test --python 3.13
      - name: Verify installed core matches locked commit
        run: |
          .venv/bin/python - <<'PYCORE'
          import importlib.metadata
          import importlib.util
          import json
          from pathlib import Path
          import sys
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())
          source = project["tool"]["uv"]["sources"]["openjiuwen"]
          expected = source["rev"]
          lock = tomllib.loads(Path("uv.lock").read_text())
          package = next(p for p in lock["package"] if p["name"] == "openjiuwen")
          assert package["source"]["git"].endswith("#" + expected), "core lock SHA mismatch"
          dist = importlib.metadata.distribution("openjiuwen")
          direct = json.loads(dist.read_text("direct_url.json"))
          assert direct["url"].removesuffix(".git") == source["git"].removesuffix(".git")
          assert direct["vcs_info"]["commit_id"] == expected, "installed core SHA mismatch"
          origin = Path(importlib.util.find_spec("openjiuwen").origin).resolve()
          assert origin.is_relative_to(Path(sys.prefix).resolve()), "local core override detected"
          print(f"Verified locked core: {expected}; import: {origin}")
          PYCORE
      - name: Warm legacy pysbd bytecode
        run: .venv/bin/python -W 'ignore:invalid escape sequence:SyntaxWarning' -c 'import pysbd'
      - name: Install Web, Browser and TUI dependencies
        run: |
          npm ci --prefix jiuwenswarm/channels/web/frontend
          npm ci --prefix jiuwenswarm/channels/browser/frontend
          npm ci --prefix jiuwenswarm/channels/tui/frontend
      - name: Build TUI contract fixture
        run: npm run build --prefix jiuwenswarm/channels/tui/frontend
      - name: Verify orchestrator
        run: python3 -m unittest tools.tests.test_testctl tools.tests.test_provider_acceptance -v
      - name: Verify OAuth UI and disabled CLI detection
        working-directory: jiuwenswarm/channels/web/frontend
        run: |
          npm run test:cli-auth-modal
          npm run test:codex-governed-availability
      - name: Run stable regression
        env:
          TESTCTL_RETENTION_DAYS: ${{ github.event_name == 'schedule' && '90' || '30' }}
          TESTCTL_NETWORK_MODE: strict
          TESTCTL_BWRAP_SUDO: '1'
        run: python3 tools/testctl.py run --profile pr-stable
      - name: Verify instance MCP and maintenance consumers
        env:
          HOME: ${{ runner.temp }}/instance-consumer-home
          TMPDIR: ${{ runner.temp }}/instance-consumer-tmp
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$HOME" "$TMPDIR"
          cd "$TMPDIR"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest --override-ini addopts='' -o asyncio_mode=auto --timeout=30 -q \
            "$GITHUB_WORKSPACE/tests/unit_tests/agentserver/mcp" \
            "$GITHUB_WORKSPACE/tests/unit_tests/test_updater_authority.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/test_updater_install_mode.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/gateway/test_channel_manager_config.py"
      - name: Verify Code approvals and targeted cancellation
        env:
          JIUWENSWARM_HOME: ${{ runner.temp }}/evaluation-code-home
          JIUWENSWARM_DATA_DIR: ${{ runner.temp }}/evaluation-code-data
          JIUWENSWARM_CONFIG_URL: "off"
        run: |
          .venv/bin/python -m pytest --override-ini addopts='' -o asyncio_mode=auto --timeout=30 -q \
            tests/unit_tests/agentserver/test_interrupt_helpers.py \
            tests/unit_tests/agentserver/test_interrupt_history.py \
            tests/unit_tests/agentserver/test_interrupt_output_handoff.py \
            tests/unit_tests/runtime/harness/test_external_goal_projection.py \
            tests/unit_tests/agentserver/test_interface_interrupts.py \
            tests/unit_tests/runtime/harness/test_native_detached_projection.py \
            tests/unit_tests/runtime/test_runtime_session_coordinator.py \
            tests/unit_tests/runtime/harness/test_output_budget.py \
            tests/unit_tests/runtime/harness/test_stop_terminal_delivery.py \
            tests/unit_tests/extensions/evaluation/test_trials.py
      - name: Upload test archive
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: codeswarm-testctl-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-runs/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  full-python:
    # Full Python regression is a daily audit, not a per-commit gate.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.5'
      - name: Install full Python environment
        run: uv sync --locked --group test --extra desktop --python 3.13
      - name: Verify installed core matches locked commit
        run: |
          .venv/bin/python - <<'PYCORE'
          import importlib.metadata
          import importlib.util
          import json
          from pathlib import Path
          import sys
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())
          source = project["tool"]["uv"]["sources"]["openjiuwen"]
          expected = source["rev"]
          lock = tomllib.loads(Path("uv.lock").read_text())
          package = next(p for p in lock["package"] if p["name"] == "openjiuwen")
          assert package["source"]["git"].endswith("#" + expected), "core lock SHA mismatch"
          dist = importlib.metadata.distribution("openjiuwen")
          direct = json.loads(dist.read_text("direct_url.json"))
          assert direct["url"].removesuffix(".git") == source["git"].removesuffix(".git")
          assert direct["vcs_info"]["commit_id"] == expected, "installed core SHA mismatch"
          origin = Path(importlib.util.find_spec("openjiuwen").origin).resolve()
          assert origin.is_relative_to(Path(sys.prefix).resolve()), "local core override detected"
          print(f"Verified locked core: {expected}; import: {origin}")
          PYCORE
      - name: Warm legacy pysbd bytecode
        run: .venv/bin/python -W 'ignore:invalid escape sequence:SyntaxWarning' -c 'import pysbd'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install frontend test dependencies
        run: |
          npm ci --prefix jiuwenswarm/channels/web/frontend
          npm ci --prefix jiuwenswarm/channels/browser/frontend
          npm ci --prefix jiuwenswarm/channels/tui/frontend
          npm run build --prefix jiuwenswarm/channels/tui/frontend
      - name: Verify full-run accounting
        run: python3 -m unittest tools.tests.test_full_shards tools.tests.test_provider_acceptance -v
      - name: Run full Python regression
        env:
          FULL_PYTHON_WORKERS: '4'
        run: .venv/bin/python tools/full_regression.py --workers "$FULL_PYTHON_WORKERS"
      - name: Upload full Python archive
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: codeswarm-full-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-runs/full-python-*/
          if-no-files-found: error
          retention-days: 90
